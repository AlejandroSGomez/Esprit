name: Windows update test
# End-to-end check of «actualiza Esprit» on Windows, following
# .claude/skills/actualizar-esprit/references/windows.md: an existing install
# of an earlier Release with a user configuration is updated to the latest
# Release (checksum verified, silent per-user installer), then the installed
# version, the untouched configuration and the native config check are
# verified. Synthetic data only; no accounts or integrations are used.
on:
  workflow_dispatch:
    inputs:
      from:
        description: Release already installed before the update
        default: v0.4.0-beta.1
  workflow_run:
    workflows: [Windows beta]
    types: [completed]
permissions:
  contents: read
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      FROM: ${{ inputs.from || 'v0.4.0-beta.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update from the previous installation to latest
        shell: pwsh
        run: |
          python -m pip install --quiet tzdata
          if ($LASTEXITCODE -ne 0) { throw 'Could not install timezone data.' }
          $release = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
          "Latest: $($release.tag_name)"
          $installers = @($release.assets | Where-Object { $_.name -like '*-setup.exe' })
          $checksums = @($release.assets | Where-Object { $_.name -ceq 'SHA256SUMS.txt' })
          if ($installers.Count -ne 1 -or $checksums.Count -ne 1) { throw 'Latest release must contain one installer and SHA256SUMS.txt.' }
          $download = Join-Path $env:RUNNER_TEMP ('esprit-latest-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory $download | Out-Null
          foreach ($asset in @($installers[0], $checksums[0])) {
            Invoke-WebRequest $asset.browser_download_url -OutFile (Join-Path $download $asset.name)
          }
          ./scripts/test_windows_upgrade.ps1 -From $env:FROM -CandidateInstaller (Join-Path $download $installers[0].name) -CandidateVersion ($release.tag_name.TrimStart('v')) -CandidateChecksumFile (Join-Path $download 'SHA256SUMS.txt')
