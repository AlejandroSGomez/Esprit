[package]
name = "esprit"
version = "0.1.0"
description = "Centro local y personalizable para el doctorado"
authors = ["A.S. Gómez"]
edition = "2021"

[lib]
name = "esprit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
